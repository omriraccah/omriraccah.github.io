    <script>
      document.querySelectorAll('a[href^="#"]').forEach(function(anchor) {

    <script>
    (function() {
      var c = document.getElementById('graph-bg');
      if (!c) return;
      var ctx = c.getContext('2d');
      var W, H;
      var BAND_H = 350, FADE = 60;
      function resize() { W = c.width = c.offsetWidth; H = c.height = BAND_H; }
      resize();
      window.addEventListener('resize', resize);

      function edgeFade(y) {
        if (y < FADE) return y / FADE;
        if (y > H - FADE) return (H - y) / FADE;
        return 1;
      }

      var NODE_COUNT = 28, CONN_DIST = 250;
      var cls = [{ cx:0.2,cy:0.5,s:0.14 },{ cx:0.5,cy:0.5,s:0.15 },{ cx:0.8,cy:0.5,s:0.14 }];

      function mkNode() {
        var cl = cls[Math.floor(Math.random()*cls.length)];
        var a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*cl.s*W;
        var x = W*cl.cx+Math.cos(a)*r, y = H*0.2+Math.random()*H*0.6;
        var hue = 210+(Math.random()-0.5)*30, sat = 25+Math.random()*20, lit = 55+Math.random()*15;
        var depth = Math.random(), ds = 0.5+depth*0.5;
        return {
          x:x, y:y, hx:x, hy:y, vx:(Math.random()-0.5)*0.1, vy:(Math.random()-0.5)*0.1,
          baseRad:(4+Math.random()*6)*ds, rad:0, ph:Math.random()*Math.PI*2,
          wAmp:0.15+Math.random()*0.2, wfx:0.0002+Math.random()*0.00025, wfy:0.00016+Math.random()*0.0002,
          pp:Math.random()*Math.PI*2, ps:0.006+Math.random()*0.008,
          depth:depth, bAlpha:0.4+depth*0.6, act:0, hue:hue, sat:sat, lit:lit
        };
      }

      var nodes = [];
      for (var i=0;i<NODE_COUNT;i++) nodes.push(mkNode());
      nodes.sort(function(a,b){return a.depth-b.depth;});

      var edges = [];
      function mkEdge(a,b) { return { a:a, b:b, life:0, max:250+Math.random()*350, curv:(Math.random()-0.5)*60 }; }
      for (var i=0;i<nodes.length;i++) for (var j=i+1;j<nodes.length;j++) {
        var d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);
        if (d<CONN_DIST*0.6&&Math.random()<0.25) { var e=mkEdge(nodes[i],nodes[j]); e.life=Math.floor(Math.random()*e.max*0.3); edges.push(e); }
      }

      function getNeighbors(nd){var nb=[];for(var i=0;i<edges.length;i++){var e=edges[i];if(e.life<e.max){if(e.a===nd)nb.push(e.b);else if(e.b===nd)nb.push(e.a);}}return nb;}
      function triggerRipple(){
        var src=nodes[Math.floor(Math.random()*nodes.length)];
        src.act=Math.min(1,src.act+1);
        (function spread(nd,str,dep){
          if(dep>3||str<0.15)return;var nb=getNeighbors(nd);
          for(var i=0;i<nb.length;i++)(function(n,s){setTimeout(function(){n.act=Math.min(1,n.act+s);spread(n,s*0.5,dep+1);},200+Math.random()*150);})(nb[i],str);
        })(src,0.6,0);
      }
      var frame=0, nextFire=120+Math.random()*180;
      function animate(t) {
        ctx.clearRect(0,0,W,H);
        for(var i=0;i<nodes.length;i++){
          var n=nodes[i];
          n.x+=n.vx+Math.sin(t*n.wfx+n.ph)*n.wAmp;
          n.y+=n.vy+Math.cos(t*n.wfy+n.ph*1.3)*n.wAmp*0.8;
          n.vx+=(n.hx-n.x)*0.00012; n.vy+=(n.hy-n.y)*0.00012;
          n.vx*=0.994; n.vy*=0.994;
          n.pp+=n.ps; n.rad=n.baseRad*(1+0.12*Math.sin(n.pp));
          n.act*=0.985; if(n.act<0.01)n.act=0;
        }
        if(frame%8===0&&edges.length<45){
          var a=nodes[Math.floor(Math.random()*nodes.length)],best=null,bd=Infinity;
          for(var j=0;j<nodes.length;j++){if(nodes[j]===a)continue;var d=Math.hypot(a.x-nodes[j].x,a.y-nodes[j].y);
            if(d<CONN_DIST&&d<bd){var dup=false;for(var k=0;k<edges.length;k++){if(edges[k].life<edges[k].max&&((edges[k].a===a&&edges[k].b===nodes[j])||(edges[k].a===nodes[j]&&edges[k].b===a))){dup=true;break;}}if(!dup){best=nodes[j];bd=d;}}}
          if(best)edges.push(mkEdge(a,best));
        }
        for(var i=edges.length-1;i>=0;i--){
          var e=edges[i]; e.life++;
          if(e.life>=e.max){edges.splice(i,1);continue;}
          var s=e.life<50?e.life/50:(e.life>e.max-70?(e.max-e.life)/70:1);
          var dist=Math.hypot(e.a.x-e.b.x,e.a.y-e.b.y), pf=Math.max(0.3,1-dist/CONN_DIST);
          var da=Math.min(e.a.bAlpha,e.b.bAlpha)*Math.min(edgeFade(e.a.y),edgeFade(e.b.y));
          var mx2=(e.a.x+e.b.x)/2, my2=(e.a.y+e.b.y)/2;
          var edx=e.b.x-e.a.x, edy=e.b.y-e.a.y, eln=Math.sqrt(edx*edx+edy*edy)||1;
          ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y);
          ctx.quadraticCurveTo(mx2+(-edy/eln)*e.curv, my2+(edx/eln)*e.curv, e.b.x, e.b.y);
          ctx.strokeStyle='rgba(140,155,185,'+(s*pf*0.45*da)+')';
          ctx.lineWidth=(1.2+pf*2.5)*s; ctx.stroke();
        }
        nextFire--; if(nextFire<=0){triggerRipple();nextFire=200+Math.random()*300;}
        for(var i=0;i<nodes.length;i++){
          var n=nodes[i], al=n.bAlpha*edgeFade(n.y), ac=n.act*edgeFade(n.y);
          if(ac>0.05){var gr=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.rad*(3+ac*5));
            gr.addColorStop(0,'hsla('+n.hue+','+(n.sat+15)+'%,'+(n.lit+15)+'%,'+(ac*0.3)+')');
            gr.addColorStop(1,'hsla('+n.hue+','+n.sat+'%,'+n.lit+'%,0)');
            ctx.fillStyle=gr;ctx.beginPath();ctx.arc(n.x,n.y,n.rad*(3+ac*5),0,Math.PI*2);ctx.fill();}
          ctx.beginPath();ctx.arc(n.x+1.5,n.y+2,n.rad,0,Math.PI*2);
          ctx.fillStyle='rgba(100,120,160,'+(0.08*al)+')';ctx.fill();
          ctx.beginPath();ctx.arc(n.x,n.y,n.rad,0,Math.PI*2);
          ctx.fillStyle='hsla('+n.hue+','+(n.sat+ac*10)+'%,'+(n.lit+ac*20)+'%,'+al+')';ctx.fill();
          ctx.strokeStyle='hsla('+n.hue+','+(n.sat-5)+'%,'+(n.lit-12+ac*20)+'%,'+(al*0.7)+')';
          ctx.lineWidth=1;ctx.stroke();
        }
        frame++;requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    })();
    </script>
