    <script>
    (function() {
      var c = document.getElementById('graph-bg');
      if (!c) return;
      var ctx = c.getContext('2d');
      var W, H, FADE = 50;
      function resize() { W = c.width = c.offsetWidth; H = c.height = 250; }
      resize();
      window.addEventListener('resize', resize);

      function edgeFade(x, y) {
        var f = 1;
        if (x < FADE) f = Math.min(f, x / FADE);
        if (x > W - FADE) f = Math.min(f, (W - x) / FADE);
        if (y < FADE) f = Math.min(f, y / FADE);
        if (y > H - FADE) f = Math.min(f, (H - y) / FADE);
        return Math.max(0, f);
      }

      var NODE_COUNT = 30, CONN_DIST = 220;
      var cls = [{ cx:0.15,cy:0.5 },{ cx:0.35,cy:0.45 },{ cx:0.55,cy:0.5 },{ cx:0.75,cy:0.45 },{ cx:0.9,cy:0.5 }];

      function mkNode() {
        var cl = cls[Math.floor(Math.random()*cls.length)];
        var a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*W*0.1;
        var x = W*cl.cx+Math.cos(a)*r, y = H*cl.cy+Math.sin(a)*r*0.6;
        var hue = 210+(Math.random()-0.5)*30, sat = 25+Math.random()*20, lit = 55+Math.random()*15;
        var depth = Math.random(), ds = 0.5+depth*0.5;
        return {
          x:x, y:y, hx:x, hy:y, vx:(Math.random()-0.5)*0.08, vy:(Math.random()-0.5)*0.08,
          baseRad:(3+Math.random()*5)*ds, rad:0, ph:Math.random()*Math.PI*2,
          wAmp:0.1+Math.random()*0.12, wfx:0.00018+Math.random()*0.0002, wfy:0.00014+Math.random()*0.00018,
          pp:Math.random()*Math.PI*2, ps:0.005+Math.random()*0.006,
          depth:depth, bAlpha:0.4+depth*0.6, hue:hue, sat:sat, lit:lit
        };
      }

      var nodes = [];
      for (var i=0;i<NODE_COUNT;i++) nodes.push(mkNode());
      nodes.sort(function(a,b){return a.depth-b.depth;});

      var edges = [];
      function mkEdge(a,b) { return { a:a, b:b, life:0, max:300+Math.random()*400, curv:(Math.random()-0.5)*45 }; }
      for (var i=0;i<nodes.length;i++) for (var j=i+1;j<nodes.length;j++) {
        var d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);
        if (d<CONN_DIST*0.6&&Math.random()<0.25) { var e=mkEdge(nodes[i],nodes[j]); e.life=Math.floor(Math.random()*e.max*0.3); edges.push(e); }
      }

      var frame=0;
      function animate(t) {
        ctx.clearRect(0,0,W,H);
        for(var i=0;i<nodes.length;i++){
          var n=nodes[i];
          n.x+=n.vx+Math.sin(t*n.wfx+n.ph)*n.wAmp;
          n.y+=n.vy+Math.cos(t*n.wfy+n.ph*1.3)*n.wAmp*0.8;
          n.vx+=(n.hx-n.x)*0.0001; n.vy+=(n.hy-n.y)*0.0001;
          n.vx*=0.995; n.vy*=0.995;
          n.pp+=n.ps; n.rad=n.baseRad*(1+0.1*Math.sin(n.pp));
        }
        if(frame%10===0&&edges.length<40){
          var a=nodes[Math.floor(Math.random()*nodes.length)],best=null,bd=Infinity;
          for(var j=0;j<nodes.length;j++){if(nodes[j]===a)continue;var d=Math.hypot(a.x-nodes[j].x,a.y-nodes[j].y);
            if(d<CONN_DIST&&d<bd){var dup=false;for(var k=0;k<edges.length;k++){if(edges[k].life<edges[k].max&&((edges[k].a===a&&edges[k].b===nodes[j])||(edges[k].a===nodes[j]&&edges[k].b===a))){dup=true;break;}}if(!dup){best=nodes[j];bd=d;}}}
          if(best)edges.push(mkEdge(a,best));
        }
        for(var i=edges.length-1;i>=0;i--){
          var e=edges[i]; e.life++;
          if(e.life>=e.max){edges.splice(i,1);continue;}
          var s=e.life<50?e.life/50:(e.life>e.max-70?(e.max-e.life)/70:1);
          var dist=Math.hypot(e.a.x-e.b.x,e.a.y-e.b.y), pf=Math.max(0.3,1-dist/CONN_DIST);
          var da=Math.min(e.a.bAlpha,e.b.bAlpha)*Math.min(edgeFade(e.a.x,e.a.y),edgeFade(e.b.x,e.b.y));
          var mx2=(e.a.x+e.b.x)/2, my2=(e.a.y+e.b.y)/2;
          var edx=e.b.x-e.a.x, edy=e.b.y-e.a.y, eln=Math.sqrt(edx*edx+edy*edy)||1;
          ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y);
          ctx.quadraticCurveTo(mx2+(-edy/eln)*e.curv, my2+(edx/eln)*e.curv, e.b.x, e.b.y);
          ctx.strokeStyle='rgba(140,155,185,'+(s*pf*0.45*da)+')';
          ctx.lineWidth=(1+pf*2)*s; ctx.stroke();
        }
        for(var i=0;i<nodes.length;i++){
          var n=nodes[i], al=n.bAlpha*edgeFade(n.x,n.y);
          if(al<0.02)continue;
          ctx.beginPath();ctx.arc(n.x+1,n.y+1.5,n.rad,0,Math.PI*2);
          ctx.fillStyle='rgba(100,120,160,'+(0.06*al)+')';ctx.fill();
          ctx.beginPath();ctx.arc(n.x,n.y,n.rad,0,Math.PI*2);
          ctx.fillStyle='hsla('+n.hue+','+n.sat+'%,'+n.lit+'%,'+al+')';ctx.fill();
          ctx.strokeStyle='hsla('+n.hue+','+(n.sat-5)+'%,'+(n.lit-12)+'%,'+(al*0.7)+')';
          ctx.lineWidth=1;ctx.stroke();
        }
        frame++;requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    })();
    </script>
