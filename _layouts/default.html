<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" }}">
    <!--[if lt IE 9]>
    <script src="//cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
  </head>
  <body>
    <nav class="top-nav drop-in">
      <ul>
        <li><a href="/publications.html">Publications</a></li>
        <li><a href="/files/cv.pdf" target="_blank">Curriculum Vitae</a></li>
      </ul>
    </nav>
    <div class="wrapper">
      <header>

        {% if site.logo %}
          <img src="{{site.logo | relative_url}}" alt="Logo" />
        {% endif %}
         <p></p>
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
        <p style="font-weight:300; margin-bottom:8px;">Postdoctoral Fellow<br>Yale University</p>
        <p style="margin-bottom:10px;"> <a href="mailto:omri.raccah@yale.edu" target="_blank">omri.raccah@yale.edu</a> </p>

        <p style="margin-bottom:0;">
          <a href="https://scholar.google.com/citations?user=klsi0KcAAAAJ&hl=en" target="_blank">
    <img src="/files/scholar.png" style="height:25px; width:auto;">&nbsp </a>
          <a href="https://bsky.app/profile/omriraccah.bsky.social" target="_blank">
    <img src="/files/bluesky.png" style="height:25px; width:auto;">&nbsp</a>
          <a href="https://x.com/omriraccah" target="_blank">
    <img src="/files/x.png" style="height:24px; width:auto;">&nbsp</a>
          <a href="https://www.linkedin.com/in/omri-raccah" target="_blank">
    <img src="/files/linkedin.svg" style="height:25px; width:auto;">&nbsp </a>
          <a href="https://orcid.org/0000-0002-3393-581X" target="_blank">
    <img src="/files/orcid.svg" style="height:25px; width:auto;">&nbsp</a>
        </p>


      </header>
      <section>

      {{ content }}

      </section>
       <footer>

       </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
    <script>
      document.querySelectorAll('a[href^="#"]').forEach(function(anchor) {
        anchor.addEventListener('click', function(e) {
          var target = document.querySelector(this.getAttribute('href'));
          if (target) {
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth' });
          }
        });
      });
    </script>
    {% if site.google_analytics %}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google_analytics }}', 'auto');
      ga('send', 'pageview');
    </script>
    {% endif %}
  </body>
</html>
